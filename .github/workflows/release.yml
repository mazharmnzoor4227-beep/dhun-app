name: Publish APK release
on:
  workflow_dispatch:
  push:
    paths:
      - 'releases/**'
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reassemble, verify and publish every APK that has no release yet
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for sumfile in releases/Dhun-*.apk.sha256; do
            [ -e "$sumfile" ] || continue
            apk=$(basename "$sumfile" .sha256)
            ver=${apk#Dhun-}; ver=${ver%.apk}
            if gh release view "v$ver" >/dev/null 2>&1; then echo "v$ver already released"; continue; fi
            cat releases/$apk.part* > "$apk"
            sha256sum -c "$sumfile"
            gh release create "v$ver" "$apk" --title "Dhun $ver" --notes "Dhun $ver (arm64), signed release build." --target "${{ github.sha }}"
          done
